name: SemVer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version follows SemVer
        run: python .github/scripts/check_semver.py "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
